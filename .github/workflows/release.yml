name: Release Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Determine Version and Tag
        id: tag_info
        run: |
          VERSION_NAME=$(grep 'versionName = ' app/build.gradle.kts | head -n 1 | awk -F '"' '{print $2}')
          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME="1.0.0"
          fi
          TAG="v${VERSION_NAME}-b${{ github.run_number }}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "Generated tag: $TAG"

      - name: Configure Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from repository secrets..."
            echo "$KEYSTORE_BASE64" | base64 -d > release.jks
            cat <<EOF > keystore.properties
          storeFile=../release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          else
            echo "Generating self-signed build keystore for CI release..."
            keytool -genkeypair -v -keystore release.jks -alias lastdrop -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=LastDrop, OU=CI, O=OpenSource, L=Unknown, ST=Unknown, C=US"
            cat <<EOF > keystore.properties
          storeFile=../release.jks
          storePassword=android
          keyAlias=lastdrop
          keyPassword=android
          EOF
          fi

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-output
          TAG="${{ steps.tag_info.outputs.tag }}"
          APK_SRC="app/build/outputs/apk/release/app-release.apk"
          APK_DEST="release-output/LastDrop-${TAG}.apk"
          if [ -f "$APK_SRC" ]; then
            cp "$APK_SRC" "$APK_DEST"
            echo "Artifact prepared at $APK_DEST"
          else
            echo "Error: Release APK not found at $APK_SRC"
            exit 1
          fi

      - name: Create Git Tag
        env:
          TAG: ${{ steps.tag_info.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Automated build release $TAG"
          git push origin "$TAG"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: LastDrop ${{ steps.tag_info.outputs.tag }}
          body: |
            ### Automated Release Build
            - **Version:** `${{ steps.tag_info.outputs.version }}`
            - **Build Number:** `${{ github.run_number }}`
            - **Commit:** `${{ github.sha }}`

            Download the attached release APK below.
          files: |
            release-output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
